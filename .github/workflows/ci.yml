name: CI

# Every push and every pull request. Until now the only workflow in this
# repository was deploy.yml — so 2908 tests, ruff, the typechecker and the web
# build ran on one laptop and nowhere else. A test that only ever runs where
# it was written is a test that stops running the day that laptop is busy.
#
# Deliberately NOT part of deploy.yml. Deployment is a different question from
# correctness, and a deploy that waits ten minutes for a test suite is a
# deploy people learn to skip.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first: the answer to "is main green" is about
# the newest commit, and paying for two answers to a question with one useful
# reply is how CI minutes disappear.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: tests + lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"     # pyproject: requires-python = ">=3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The package itself, so `import src...` resolves the same way it
          # does locally, plus the dev extra that carries pytest and ruff.
          pip install -e ".[dev]"

      # Not `ruff check` outright: this repository carries 602 findings that
      # predate CI, and a build that is red on day one is a build everybody
      # learns to ignore. The ratchet fails when the number GROWS, so new code
      # meets the standard immediately and the backlog is paid down by whoever
      # is already in the file.
      #
      # A third of the original 933 was not debt at all — B008 flagging
      # `Depends(...)`, which is FastAPI's required idiom. The linter had
      # never been told what framework it was reading.
      - name: Ruff (must not get worse)
        run: python scripts/lint_ratchet.py

      # GEMINI_API_KEY is read at import time by settings; the value is never
      # used because no test reaches a provider — integration tests are
      # deselected by addopts in pyproject.toml. A dummy keeps the import from
      # refusing, and makes it obvious in the log that nothing real is called.
      - name: Tests
        env:
          GEMINI_API_KEY: dummy-for-tests
          # The product refuses a signing secret under 16 characters
          # (src/api/jwt_auth.py). This value is 15, so every test that
          # builds an app failed at import — CI has been red on that alone.
          CELMIS_JWT_SECRET: dummy-for-tests-not-a-real-secret
        run: pytest -q -p no:warnings --durations=10

  web:
    name: typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # The frontend is pnpm, not npm: `web/pnpm-lock.yaml` is what is
      # committed and there is no `package-lock.json` to cache or install
      # from. Asking setup-node for an npm cache pointed the action at a path
      # that does not exist, which failed the job before a line of TypeScript
      # was read. pnpm has to be on PATH BEFORE setup-node, because that is
      # when the cache is resolved.
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Three separate steps rather than one `&&`: when this goes red the
      # question is which of the three, and a combined step answers it with a
      # wall of output.
      - name: Typecheck
        run: npx tsc --noEmit

      # THE PREVIOUS COMMENT HERE WAS FALSE, and it is worth saying why rather
      # than deleting it. It read: the rules-of-hooks rule "is now enforced as
      # a TEST — tests/web/test_rules_of_hooks.py, in the python job above — so
      # it is blocking there rather than advisory here". Those tests carry
      # `skipif(not _eslint_available())`, and the python job never runs
      # `pnpm install`, so `web/node_modules` is absent and all of them report
      # SKIPPED. The rule was blocking nowhere, and this step's `|| echo`
      # ensured that too. A gate everybody believes in and nothing enforces is
      # worse than an admitted absence.
      #
      # `scripts/eslint_gate.py` is the enforcement, and it is two rules of
      # different kinds: rules-of-hooks is fatal at any count — zero today,
      # and it is the rule whose breach took every authenticated page down —
      # while everything else ratchets from a measured baseline of 42, which
      # may fall and may not rise. The number lives in that file so lowering
      # it is a visible edit rather than a drifting threshold.
      - name: Lint (rules-of-hooks fatal, the rest ratcheted)
        run: python3 ../scripts/eslint_gate.py

      - name: Build
        env:
          # Baked in at build time; the real value only matters at deploy.
          NEXT_PUBLIC_API_BASE: http://localhost:8000
        run: npm run build
