name: Release images

# Build the three images ONCE, on a tag, and publish them to GHCR.
#
# Until now every push to main rebuilt all three ON THE PRODUCTION SERVER over
# ssh, and the rented runner was billed for the ~17.5 minutes it spent watching.
# That is what exhausted the account's 2000 included Actions minutes. It was
# also the worst possible place to build: measured on that box, one `api` build
# took 485 seconds and 4.2GB of a disk that had 4.2GB free, with NO cache reuse
# — `docker builder prune -af` reclaims 0B there, and the deploy ran it three
# times a build for nothing.
#
# Tags are rare, so the minutes are cheap. And a user installs by pulling three
# images instead of building them, which is the single biggest barrier to
# trying this product.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false      # a half-published release is worse than a slow one

permissions:
  contents: write                # to publish the GitHub Release for the tag
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false           # one image failing must not hide the others
      matrix:
        include:
          - name: api
            context: .
            dockerfile: Dockerfile
          - name: web
            context: ./web
            dockerfile: web/Dockerfile
          - name: sandbox
            context: .
            dockerfile: Dockerfile.sandbox
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # THE TAG AND THE LITERAL HAVE TO AGREE, and this is the only place
      # that can tell. `src/__init__.py` holds the version as a literal on
      # purpose — it is readable without installing the package — but a
      # literal is exactly what drifts: eight tags were cut while it still
      # said 0.1.0, so a v0.1.7 install reported itself as 0.1.0 and the
      # number the product gave about itself was false.
      #
      # Checked BEFORE the build, so a mismatch costs seconds rather than
      # three multi-arch images.
      - name: The tag must match src/__init__.py
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          lit=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/__init__.py)
          [ "$tag" = "v$lit" ] || {
            echo "::error::tag $tag but src/__init__.py says $lit."
            echo "::error::Bump the literal to ${tag#v} in the same commit as the tag."
            exit 1
          }
          echo "tag $tag matches the literal"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lower-case the owner: GHCR rejects an upper-case path, and
      # github.repository_owner is spelled however the account is.
      - name: Work out the image name
        id: img
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo="ghcr.io/$owner/celmis-${{ matrix.name }}"
          ref="${{ inputs.tag || github.ref_name }}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$ref" >> "$GITHUB_OUTPUT"

          # :LATEST BELONGS TO THE NEWEST RELEASE, NOT TO WHATEVER WAS BUILT
          # LAST. This list used to carry `:latest` unconditionally, so
          # rebuilding an old tag — a moved tag, a rerun, a cache
          # investigation — repointed it at old code while every log line
          # stayed green. `.env.example` ships CELMIS_TAG=latest and compose
          # falls back to it, so that tag is exactly what a first-time
          # install pulls.
          #
          # The decision is a script because a YAML expression cannot be run
          # in a test, and tests/ci/test_latest_means_the_newest_release.py
          # runs this one.
          #
          # ls-remote rather than `git tag`: the checkout is shallow and
          # carries only the tag being built.
          #
          # A TREE WITHOUT THE SCRIPT IS A TREE FROM BEFORE THIS FIX, which is
          # to say an old release — and an old release is exactly what must
          # not move :latest. So its absence is an answer, not an error. The
          # checkout follows `inputs.tag`, so rebuilding v0.1.0 checks out
          # v0.1.0, where this file does not exist.
          if [ -f scripts/should_move_latest.py ]; then
            move=$(git ls-remote --tags --refs origin \
                   | sed 's|.*refs/tags/||' \
                   | python3 scripts/should_move_latest.py "$ref")
          else
            move=false
            echo "no decision script in this tree — an older release; :latest stays"
          fi
          echo "moves_latest=$move"
          {
            echo "tags<<TAGS_EOF"
            echo "$repo:$ref"
            if [ "$move" = "true" ]; then echo "$repo:latest"; fi
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # BOTH, because the hosts we document are not the host we run.
          # This said "the only architecture we deploy to" and meant the one
          # box in front of me — while docs/ORACLE_CICD.md picks an Ampere A1
          # and docs/HETZNER.md a CAX21, both arm64, and the Dockerfile carries
          # per-architecture SHA pins precisely so arm64 works. An amd64-only
          # manifest answers "no matching manifest for linux/arm64/v8" on the
          # machines the documentation tells people to buy.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.img.outputs.tags }}
          # Cache in the registry rather than on a server with 4GB free.
          cache-from: type=registry,ref=${{ steps.img.outputs.repo }}:buildcache
          cache-to: type=registry,ref=${{ steps.img.outputs.repo }}:buildcache,mode=max
          provenance: false             # keeps the manifest a plain image
          # WITHOUT THIS THE PACKAGE IS AN ORPHAN. GHCR links a package to a
          # repository through `org.opencontainers.image.source`, and only
          # through it: no label, no "Source" link on the package page, and —
          # under an organisation — no inherited repository permissions, so
          # access has to be granted to each package by hand.
          #
          # Built from `github.repository` rather than written out, so a fork
          # labels its own images and this line does not have to be edited
          # after every move.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          build-args: |
            CELMIS_VERSION=${{ steps.img.outputs.version }}

      # A tag that exists but cannot be pulled is worse than no tag: the deploy
      # would fail on the server, after the release looked finished.
      # A tag that exists but cannot be pulled is worse than no tag: the deploy
      # would fail on the server, after the release looked finished. Inspect the
      # MANIFEST rather than pulling — a pull resolves to the runner's own
      # architecture and would say nothing about the other one.
      - name: Check both architectures are published
        run: |
          ref="${{ steps.img.outputs.repo }}:${{ steps.img.outputs.tag }}"
          manifest=$(docker buildx imagetools inspect "$ref" --raw)
          for arch in amd64 arm64; do
            echo "$manifest" | grep -q "\"architecture\": *\"$arch\"" \
              || { echo "::error::$ref has no linux/$arch"; exit 1; }
          done
          echo "$ref: amd64 and arm64 published"

  # A TAG IS NOT A RELEASE, and the tools that read this repository only know
  # the second one. Eleven tags existed with an empty `releases` array: a
  # directory filling in a `current_release` field, a listing counting
  # activity, anyone opening /releases — all of them saw a project that had
  # never shipped. Tags are a git concept; Releases are the GitHub API's, and
  # nothing here was creating them.
  #
  # After the images, and only if they published: a Release announcing a
  # version whose images do not exist points at nothing.
  publish:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          # The section for this version, from its heading to the next one.
          # Written down once, in the file people already read; a second set
          # of notes composed here would drift from it by the second release.
          python3 - "$tag" <<'PY' > notes.md
          import re, sys
          tag = sys.argv[1].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
                        text, re.M | re.S)
          body = (m.group(1).strip() if m else "")
          print(body or f"See CHANGELOG.md for {tag}.")
          PY
          echo "notes<<NOTES_EOF" >> "$GITHUB_OUTPUT"
          cat notes.md >> "$GITHUB_OUTPUT"
          echo "NOTES_EOF" >> "$GITHUB_OUTPUT"

      - name: Publish the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          # `--latest` is decided by the same rule the image tag uses, and for
          # the same reason: v0.1.10 is lexicographically SMALLER than v0.1.9,
          # so anything sorting these as text points "latest" at the older
          # release. A rebuild of an old tag must not move it either.
          latest=false
          if [ -f scripts/should_move_latest.py ]; then
            latest=$(git ls-remote --tags --refs origin \
                     | sed 's|.*refs/tags/||' \
                     | python3 scripts/should_move_latest.py "$tag")
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file notes.md --latest="$latest"
          else
            gh release create "$tag" --title "$tag" --notes-file notes.md \
              --latest="$latest"
          fi
          gh release view "$tag" --json tagName,isLatest

