name: Release images

# Build the three images ONCE, on a tag, and publish them to GHCR.
#
# Until now every push to main rebuilt all three ON THE PRODUCTION SERVER over
# ssh, and the rented runner was billed for the ~17.5 minutes it spent watching.
# That is what exhausted the account's 2000 included Actions minutes. It was
# also the worst possible place to build: measured on that box, one `api` build
# took 485 seconds and 4.2GB of a disk that had 4.2GB free, with NO cache reuse
# — `docker builder prune -af` reclaims 0B there, and the deploy ran it three
# times a build for nothing.
#
# Tags are rare, so the minutes are cheap. And a user installs by pulling three
# images instead of building them, which is the single biggest barrier to
# trying this product.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false      # a half-published release is worse than a slow one

permissions:
  contents: write                # to publish the GitHub Release for the tag
  packages: write
  # BUILD PROVENANCE. Not the same mechanism as buildkit's `provenance:` below,
  # which stays false on purpose — that one rewrites the manifest into an index
  # and the comment there is right. This is a signed SLSA attestation stored
  # beside the image and verifiable with `gh attestation verify`, which is what
  # answers "was this image built from that commit, by that workflow" for
  # somebody who has only the image.
  id-token: write                # to mint the Sigstore identity for the attestation
  attestations: write            # to store it against the repository

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false           # one image failing must not hide the others
      matrix:
        include:
          - name: api
            context: .
            dockerfile: Dockerfile
          - name: web
            context: ./web
            dockerfile: web/Dockerfile
          - name: sandbox
            context: .
            dockerfile: Dockerfile.sandbox
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # `github.sha` is the head of the ref the run was DISPATCHED from, which
      # on a workflow_dispatch is the branch — not the tag checked out above.
      # v0.1.11 shipped the tag's tree labelled with main's commit, and the
      # server reads that label back as the version it displays: it reported
      # 0.1.11+f2a2b39 while running c2a5e48. The AGPL §13 footer offers source
      # at that revision, so the label has to name the tree inside the image.
      # Ask the checkout, which is the only thing that knows.
      - name: The commit this build actually contains
        id: src
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # THE TAG AND THE LITERAL HAVE TO AGREE, and this is the only place
      # that can tell. `src/__init__.py` holds the version as a literal on
      # purpose — it is readable without installing the package — but a
      # literal is exactly what drifts: eight tags were cut while it still
      # said 0.1.0, so a v0.1.7 install reported itself as 0.1.0 and the
      # number the product gave about itself was false.
      #
      # Checked BEFORE the build, so a mismatch costs seconds rather than
      # three multi-arch images.
      - name: The tag must match src/__init__.py
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          lit=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/__init__.py)
          [ "$tag" = "v$lit" ] || {
            echo "::error::tag $tag but src/__init__.py says $lit."
            echo "::error::Bump the literal to ${tag#v} in the same commit as the tag."
            exit 1
          }
          echo "tag $tag matches the literal"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lower-case the owner: GHCR rejects an upper-case path, and
      # github.repository_owner is spelled however the account is.
      - name: Work out the image name
        id: img
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo="ghcr.io/$owner/celmis-${{ matrix.name }}"
          ref="${{ inputs.tag || github.ref_name }}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$ref" >> "$GITHUB_OUTPUT"

          # THE VERSION TAG, AND NOTHING ELSE. Whether the moving tag follows
          # is decided once, in `publish`, after every image in this matrix
          # has succeeded — see the step there.
          #
          # Each leg used to decide for itself and push the moving tag as it
          # finished, so a slow one split it across two versions: on v0.1.11
          # the web leg ran 61 minutes against its usual six, on a release
          # that changed nothing under web/, and left api and sandbox on the
          # new one with web on the old. `.env.example` ships
          # CELMIS_TAG=latest and compose falls back to it, so during that
          # window a first-time `docker compose up` installed a new API
          # against an old front end. The note at the top of this file — "a
          # half-published release is worse than a slow one" — was describing
          # this matrix.
          {
            echo "tags<<TAGS_EOF"
            echo "$repo:$ref"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # BOTH, because the hosts we document are not the host we run.
          # This said "the only architecture we deploy to" and meant the one
          # box in front of me — while docs/ORACLE_CICD.md picks an Ampere A1
          # and docs/HETZNER.md a CAX21, both arm64, and the Dockerfile carries
          # per-architecture SHA pins precisely so arm64 works. An amd64-only
          # manifest answers "no matching manifest for linux/arm64/v8" on the
          # machines the documentation tells people to buy.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.img.outputs.tags }}
          # Cache in the registry rather than on a server with 4GB free.
          cache-from: type=registry,ref=${{ steps.img.outputs.repo }}:buildcache
          cache-to: type=registry,ref=${{ steps.img.outputs.repo }}:buildcache,mode=max
          provenance: false             # keeps the manifest a plain image
          # WITHOUT THIS THE PACKAGE IS AN ORPHAN. GHCR links a package to a
          # repository through `org.opencontainers.image.source`, and only
          # through it: no label, no "Source" link on the package page, and —
          # under an organisation — no inherited repository permissions, so
          # access has to be granted to each package by hand.
          #
          # Built from `github.repository` rather than written out, so a fork
          # labels its own images and this line does not have to be edited
          # after every move.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.src.outputs.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          build-args: |
            CELMIS_VERSION=${{ steps.img.outputs.version }}

      # WHAT THIS IMAGE WAS BUILT FROM, signed, for somebody who has only the
      # image. `provenance: false` above stays — that is buildkit's own
      # in-manifest attestation, which turns a plain image into an index, and
      # the comment there is right about why we do not want it. This is the
      # separate SLSA attestation stored beside the image in the registry and
      # checked with:
      #
      #     gh attestation verify oci://ghcr.io/celmis-labs/celmis-api:vX.Y.Z \
      #       --owner Celmis-labs
      #
      # Before it, every published image was unverifiable: the OCI `revision`
      # label says which commit it CLAIMS, and a label is text anybody can
      # write. The digest is the subject, not the tag, because a tag moves.
      - name: Attest what this image was built from
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.img.outputs.repo }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # A tag that exists but cannot be pulled is worse than no tag: the deploy
      # would fail on the server, after the release looked finished. Inspect the
      # MANIFEST rather than pulling — a pull resolves to the runner's own
      # architecture and would say nothing about the other one.
      - name: Check both architectures are published
        run: |
          ref="${{ steps.img.outputs.repo }}:${{ steps.img.outputs.tag }}"
          manifest=$(docker buildx imagetools inspect "$ref" --raw)
          for arch in amd64 arm64; do
            echo "$manifest" | grep -q "\"architecture\": *\"$arch\"" \
              || { echo "::error::$ref has no linux/$arch"; exit 1; }
          done
          echo "$ref: amd64 and arm64 published"

  # A TAG IS NOT A RELEASE, and the tools that read this repository only know
  # the second one. Eleven tags existed with an empty `releases` array: a
  # directory filling in a `current_release` field, a listing counting
  # activity, anyone opening /releases — all of them saw a project that had
  # never shipped. Tags are a git concept; Releases are the GitHub API's, and
  # nothing here was creating them.
  #
  # After the images, and only if they published: a Release announcing a
  # version whose images do not exist points at nothing.
  publish:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          # The section for this version, from its heading to the next one.
          # Written down once, in the file people already read; a second set
          # of notes composed here would drift from it by the second release.
          python3 - "$tag" <<'PY' > notes.md
          import re, sys
          tag = sys.argv[1].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
                        text, re.M | re.S)
          body = (m.group(1).strip() if m else "")
          print(body or f"See CHANGELOG.md for {tag}.")
          PY
          echo "notes<<NOTES_EOF" >> "$GITHUB_OUTPUT"
          cat notes.md >> "$GITHUB_OUTPUT"
          echo "NOTES_EOF" >> "$GITHUB_OUTPUT"

      - name: Does the moving tag move to this one?
        id: latest
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          # ONE DECISION, TWO CONSUMERS — the image tag below and the GitHub
          # Release's own `latest` flag. They were computed separately from
          # the same inputs, which is a place for two answers to appear.
          #
          # False until proved otherwise: v0.1.10 is lexicographically SMALLER
          # than v0.1.9, so anything sorting these as text points "latest" at
          # the older release, and a rebuild of an old tag must not move it at
          # all. A tree that predates the script cannot decide, and answers no.
          move=false
          if [ -f scripts/should_move_latest.py ]; then
            move=$(git ls-remote --tags --refs origin \
                   | sed 's|.*refs/tags/||' \
                   | python3 scripts/should_move_latest.py "$tag")
          else
            echo "no decision script in this tree — an older release; it stays"
          fi
          echo "move=$move" >> "$GITHUB_OUTPUT"
          echo "moves=$move"

      - name: Move the tag, once, for all three images
        if: steps.latest.outputs.move == 'true'
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # Retag the manifest LIST, not one architecture: `imagetools create`
          # copies the index by digest, so both platforms follow and nothing
          # is rebuilt. This job `needs: images`, so reaching here means all
          # three published — which is the whole point of doing it here and
          # not in the matrix.
          for name in api web sandbox; do
            repo="ghcr.io/$owner/celmis-$name"
            docker buildx imagetools create -t "$repo:latest" "$repo:$tag"
            echo "  $repo:latest -> $tag"
          done

      - name: Publish the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          # The same answer the image tag used, read from the step above
          # rather than recomputed — see the note there.
          latest="${{ steps.latest.outputs.move }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file notes.md --latest="$latest"
          else
            gh release create "$tag" --title "$tag" --notes-file notes.md \
              --latest="$latest"
          fi
          # `gh release view --json` has no isLatest field, so ask the API for
          # the answer we actually care about: does /releases/latest resolve
          # to this tag when we said it should. A decorative echo here would
          # not have caught a --latest that silently did nothing.
          if [ "$latest" = "true" ]; then
            got=$(gh api "repos/${{ github.repository }}/releases/latest" \
                    --jq .tag_name)
            if [ "$got" != "$tag" ]; then
              echo "::error::published $tag but /releases/latest is $got"
              exit 1
            fi
            echo "  release $tag published and marked latest"
          else
            echo "  release $tag published; an older tag keeps latest"
          fi

