name: Deploy

# Push to main -> sync the repo to the server over SSH, write .env from a
# secret, ensure Docker is present, then build & run there. Building happens ON
# the server (no cross-build, no registry). GitHub's runner reaches the server's
# port 22 even when your local network blocks outbound 22.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   SSH_HOST     server public IP (or domain)
#   SSH_USER     ssh user (Kamatera: "root")
#   SSH_KEY      the PRIVATE deploy key (whole file)
#   DEPLOY_ENV   the full contents of the production .env

# A DEPLOY NEEDS SOMETHING TO PULL. Images are published by release.yml on a
# tag, so a deploy names a tag rather than firing on every push to main — and
# that is the point. Building three images on the production box for every
# commit is what exhausted the account's included Actions minutes, and it was
# the worst place to build: measured there, `api` alone took 485 seconds and
# 4.2GB of a filesystem with 4.2GB free, with no cache reuse whatsoever.
#
# To ship main: tag it. To re-deploy or roll back: dispatch with a tag.
on:
  # AFTER the images exist, not alongside them. Both workflows firing on the
  # same tag is a race the deploy always loses: `git push --tags` starts them
  # together, and `$COMPOSE pull` reaches GHCR while release.yml is still
  # building three images cold. GHCR answers "manifest unknown", `set -e` kills
  # the step, and the tag that looked released is not deployed.
  workflow_run:
    workflows: ["Release images"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (e.g. v0.1.0). Must already be published."
        required: true

# ONE GROUP PER REF AND EVENT, not one group for the whole workflow.
#
# `group: deploy` put every run of this workflow in one bucket with
# cancel-in-progress, so ANY run cancelled ANY other. A run triggered by a
# pull_request event therefore cancelled the push-to-main deploy and then died
# itself four seconds later, because pull_request events do not carry the
# repository secrets: `ssh-keyscan -H ""` exits non-zero and takes the step
# with it. Production sat four commits behind for over an hour and the only
# visible symptom was a red run that looked like it was about to be retried.
#
# Superseding an in-flight deploy of the SAME branch is still what we want —
# the newest commit is the one that should be live — so the ref stays in the
# key.
concurrency:
  group: deploy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # THIS WORKFLOW DEPLOYS. It has no business running on a pull request, and
    # on one it cannot work anyway: no secrets, no server, nothing to do but
    # fail. The `on:` block above already says push and workflow_dispatch, but
    # a workflow file on a PR branch is evaluated from that branch, so a branch
    # that adds a pull_request trigger gets to run THIS job under a name that
    # looks legitimate. Refusing here is the half that cannot be edited by the
    # thing being guarded against.
    # Never on a pull request, and never after a release that failed —
    # deploying images a failed build may not have finished publishing is how
    # a half-release reaches production.
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SAY WHICH SECRET IS MISSING, before anything tries to use it.
      #
      # Without this the run died inside `ssh-keyscan -H ""` with its stderr
      # sent to /dev/null — four seconds, no output, and a red X that reads
      # like a flaky network. Naming the empty secret turns "deploy is broken"
      # into "DEPLOY_ENV is not set", which is a different afternoon.
      - name: Check the secrets exist
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          missing=""
          for name in SSH_HOST SSH_USER SSH_KEY DEPLOY_ENV; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::deploy cannot run — empty secret(s):$missing"
            echo "Set them in Settings → Secrets and variables → Actions."
            echo "A pull_request event never carries them; this workflow is"
            echo "push-and-dispatch only, and the job guards on that."
            exit 1
          fi
          echo "all four deploy secrets are present"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # FIRST, before rsync — on a full disk the file sync fails too, so a
      # cleanup step placed after it never gets to run.
      #
      # `image prune -f` at the end of a deploy only removes dangling images
      # and never touches the build cache, so every deploy left another few GB
      # behind until a build died mid-COPY with "no space left on device".
      # `-a` here is the point: after ~40 deploys the cache that matters is
      # hours old, not days, so an age filter reclaims nothing when it is
      # needed most. Build cache and unreferenced images are both
      # reproducible; images in use by a running container are protected by
      # docker itself.
      #
      # What is NOT here matters as much: no `volume prune`, no `system
      # prune`. Postgres, Qdrant and the LiteLLM database live in volumes on
      # this box, and a disk-cleanup step must never be able to take data with
      # it. Images and build cache are reproducible; volumes are not.
      - name: Reclaim disk (before anything writes to it)
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" '
              set -e
              echo "--- before ---"; df -h / | tail -1

              # WHERE the space goes, printed every run. The first attempt at
              # this assumed docker; the numbers said otherwise (2.4GB of
              # cache, none of it reclaimable, against 16GB used), and without
              # this the next guess would have been just as blind.
              # Growing the volume at the provider does NOT grow the
              # partition or the filesystem inside it — df keeps reporting the
              # old size and nothing improves. Both operations are online,
              # idempotent and no-ops when there is nothing to claim.
              echo "--- block devices ---"
              lsblk -o NAME,SIZE,FSSIZE,MOUNTPOINT 2>/dev/null || lsblk || true
              root_src=$(findmnt -no SOURCE / 2>/dev/null || echo "")
              case "$root_src" in
                /dev/*[0-9])
                  disk=$(echo "$root_src" | sed -E "s#/dev/(nvme[0-9]+n[0-9]+|[a-z]+)p?[0-9]+#/dev/\1#")
                  part=$(echo "$root_src" | grep -oE "[0-9]+$")
                  command -v growpart >/dev/null 2>&1 \
                    || (apt-get update -qq && apt-get install -y -qq cloud-guest-utils) >/dev/null 2>&1 || true
                  growpart "$disk" "$part" 2>&1 | tail -2 || true
                  resize2fs "$root_src" 2>&1 | tail -2 || xfs_growfs / 2>&1 | tail -2 || true
                  echo "--- after growing the filesystem ---"; df -h / | tail -1
                  ;;
              esac

              echo "--- biggest directories ---"
              du -xh --max-depth=1 / 2>/dev/null | sort -rh | head -12 || true
              # du --max-depth=1 prints directories only, so a large FILE at
              # / is counted in the total and never shown — which is how 4GB
              # of swap looked like unexplained usage for three rounds.
              echo "--- large files at / ---"
              find / -maxdepth 1 -type f -size +100M -exec du -h {} + 2>/dev/null | sort -rh || true
              echo "--- docker container logs ---"
              du -ch /var/lib/docker/containers/*/*-json.log 2>/dev/null | tail -1 || true

              # Uncapped json-file logs are the classic 20GB killer: the API
              # logs every outbound HTTP request and nothing ever rotated
              # them. Truncating is safe — these are not an audit trail, and
              # the app keeps its own ring buffer. The compose file now caps
              # them, but that only takes effect for containers recreated
              # after this deploy.
              truncate -s 0 /var/lib/docker/containers/*/*-json.log 2>/dev/null || true

              # Agent sessions clone repos into workspaces that are removed in
              # a finally block — a killed container skips that, and each
              # leftover is a full clone.
              find /root/celmis-data/agent_workspaces -maxdepth 1 -mindepth 1 -type d -mtime +1 \
                -exec rm -rf {} + 2>/dev/null || true
              find /var/lib/docker/volumes -maxdepth 4 -type d -name "agent_workspaces" 2>/dev/null \
                | while read -r d; do find "$d" -maxdepth 1 -mindepth 1 -type d -mtime +1 -exec rm -rf {} + 2>/dev/null || true; done

              # `du` accounts for ~12GB of the 16GB in use. The rest is files
              # deleted while a process still held them open — space the kernel
              # cannot return until that fd closes. `compose up` in the next
              # step recreates every container, which is what closes them, so
              # this is reported rather than forced.
              echo "--- deleted-but-open (freed when containers are recreated) ---"
              lsof -nP 2>/dev/null | awk "/deleted/ {sum+=\$8} END {printf \"%.1f GB held open\\n\", sum/1024/1024/1024}" || true

              journalctl --vacuum-size=200M 2>/dev/null || true
              apt-get clean 2>/dev/null || true

              # `docker builder prune -af` was first here and reclaimed 0B,
              # measured on this box: with the containerd image store the
              # 11.6GB it reports under "build cache" is image layers, which a
              # builder prune cannot touch. It stayed for months looking like
              # disk protection. `image prune -af` is the one that works — it
              # freed 2.7GB the first time it ran alone.
              #
              # NOT `volume prune`, NOT `system prune`: Postgres, Qdrant and
              # the LiteLLM database live in volumes on this box, and a
              # cleanup step must never be able to take data with it.
              docker image prune -af || true
              docker container prune -f || true

              echo "--- after ---"; df -h / | tail -1
              avail=$(df -Pk / | awk "NR==2{print \$4}")
              # 2GB, not the 4GB I first guessed. Every successful deploy on
              # this box ran with roughly this much headroom; 4GB turned a
              # guard meant to catch a doomed build into the thing blocking a
              # build that would have worked. The floor exists to stop a run
              # that cannot possibly finish, not to demand comfort.
              if [ "$avail" -lt 2097152 ]; then
                echo "::error::only $((avail/1024))MB free on / after cleanup. See the directory listing above for what is actually holding it."
                docker system df || true
                exit 1
              fi
            '

      - name: Sync repo to server
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='task/' \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='.venv/' \
            --exclude='web/.next/' \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new" \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:celmis/"

      # The secret goes through an ENV VAR, never through `${{ }}` inlined into
      # the shell: expression substitution happens before bash parses the line,
      # so a quote (or `$`, backtick, `<`) anywhere in the .env would break the
      # command apart and write a TRUNCATED file — which then fails deploy with
      # a confusing "POSTGRES_PASSWORD is missing" three steps later.
      - name: Write .env on server
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
          # On workflow_run the ref is the release run's head branch, so the
          # tag comes from the run that produced the images.
          CELMIS_TAG: ${{ inputs.tag || github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          printf '%s' "$DEPLOY_ENV" \
            | ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new \
                "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'cat > celmis/.env'
          # WHICH IMAGES TO RUN, in the file compose already reads.
          #
          # `docker-compose.yml` pins `ghcr.io/<owner>/celmis-*:${CELMIS_TAG}`,
          # and compose interpolates that from `.env` on its own — so the tag
          # needs no extra plumbing through ssh, and there is no second place
          # for it to disagree with the deploy that set it.
          printf 'CELMIS_TAG=%s\n' "$CELMIS_TAG" \
            | ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new \
                "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'cat >> celmis/.env'
          # Fail fast and loudly if the file did not survive the trip.
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'grep -q "^POSTGRES_PASSWORD=" celmis/.env || { echo "::error::.env on the server is truncated or malformed — check DEPLOY_ENV for characters that break shell quoting"; exit 1; }'

      # The sandbox's shared secret. Generated on the server the first time and
      # kept, rather than carried in DEPLOY_ENV: only api and the sandbox ever
      # need to agree on it, so nobody else has to hold a copy.
      #
      # It lives OUTSIDE celmis/ because the sync above runs with --delete, and
      # it is appended AFTER the .env write above, which truncates the file.
      # Both of those are why the obvious placements do not work.
      - name: Provision the sandbox token
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" '
              set -e
              mkdir -p ~/celmis-secrets
              chmod 700 ~/celmis-secrets
              if [ ! -s ~/celmis-secrets/sandbox_token ]; then
                ( umask 077
                  od -An -tx1 -N32 /dev/urandom | tr -d " \n" \
                    > ~/celmis-secrets/sandbox_token )
                echo "sandbox token generated"
              fi
              chmod 600 ~/celmis-secrets/sandbox_token
              # Replace-or-append, never blind append. `.env.example` now
              # carries `SANDBOX_TOKEN=` so a local install can generate one,
              # which means DEPLOY_ENV may already hold an (empty) line. A
              # dotenv parser keeps the LAST assignment, so appending would
              # still work — and would leave the file with a duplicate, the
              # exact shape scripts/init-env.sh refuses to run on.
              if grep -q "^SANDBOX_TOKEN=" celmis/.env; then
                sed -i "s|^SANDBOX_TOKEN=.*|SANDBOX_TOKEN=$(cat ~/celmis-secrets/sandbox_token)|" celmis/.env
              else
                printf "\nSANDBOX_TOKEN=%s\n" \
                  "$(cat ~/celmis-secrets/sandbox_token)" >> celmis/.env
              fi
              [ "$(grep -c "^SANDBOX_TOKEN=" celmis/.env)" -eq 1 ] || {
                echo "::error::SANDBOX_TOKEN assigned more than once"; exit 1; }
              # Never echo the value — this is the only place it is handled.
              grep -q "^SANDBOX_TOKEN=.\{32,\}" celmis/.env || {
                echo "::error::SANDBOX_TOKEN did not reach .env"; exit 1; }
            '

      # Stamp the running containers with the commit they were built from, so
      # "is my change live yet?" is a question the server can answer.
      - name: Stamp the build
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'printf "\nCELMIS_GIT_SHA=${{ github.sha }}\nCELMIS_DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)\n" >> celmis/.env'

      # `set -e` in the remote script is load-bearing: without it a failed
      # `compose up --build` is masked by the exit code of the following
      # `image prune`, and the job reports success while the server keeps
      # running the previous image.
      - name: Provision + build + deploy
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" '
              set -e
              command -v docker >/dev/null || curl -fsSL https://get.docker.com | sh
              cd celmis
              COMPOSE="docker compose -f docker-compose.yml -f deploy/oracle/caddy-http.yml"

              # PULL, DO NOT BUILD.
              #
              # This built all three images here, one at a time, with
              # `docker builder prune -af` between them to protect the disk.
              # Every part of that turned out to be wrong, measured on this box:
              #
              #   * `api` alone took 485 seconds and 4.2GB of a filesystem with
              #     4.2GB free;
              #   * an UNCHANGED rebuild cost the same 485 seconds — with the
              #     containerd image store there is no build cache to reuse;
              #   * and `docker builder prune -af` reclaims 0B here, so the
              #     command that made it slow was a no-op run three times a
              #     deploy.
              #
              # Meanwhile a rented runner was billed for the ~17.5 minutes it
              # spent watching, which is what exhausted the the account included
              # Actions minutes and stopped deployment altogether.
              #
              # Images now come from GHCR, built once per tag by release.yml.
              # Measured here: 6 seconds to pull, and the disk does not move.
              # CELMIS_TAG was appended to .env above; compose reads it itself.
              $COMPOSE pull api web sandbox

              # NOT fatal on its own, and that ordering is the whole point.
              #
              # Compose recreates a network whose definition changed and then
              # RECONNECTS the containers it is not recreating — and a
              # reconnect does NOT restore the service-name alias. Postgres
              # keeps its container id and quietly answers only to
              # `celmis-postgres`, so every service that connects to
              # `postgres` fails DNS and `up -d` exits non-zero because api
              # never becomes healthy.
              #
              # With `set -e` and a bare `up -d`, the script dies THERE — on
              # the symptom — and the repair below never runs. That is exactly
              # what happened on the deploy that took the box down: the guard
              # existed and was unreachable.
              UP_FAILED=""
              $COMPOSE up -d || UP_FAILED=1

              # Repair aliases unconditionally, whether or not the line above
              # succeeded. Recreating the service reattaches it to the network
              # properly, which is what puts the alias back.
              REPAIRED=""
              for svc in postgres qdrant; do
                if ! docker run --rm --network celmis_default alpine:3 \
                     getent hosts "$svc" >/dev/null 2>&1; then
                  echo "::warning::$svc lost its network alias on reconnect — recreating"
                  $COMPOSE up -d --no-build --force-recreate "$svc" || true
                  REPAIRED=1
                fi
              done

              # Only now, with DNS actually working, is a failed `up -d` worth
              # retrying — the first attempt failed for a reason that has just
              # been removed.
              if [ -n "$UP_FAILED" ] || [ -n "$REPAIRED" ]; then
                echo "retrying up -d after alias repair"
                $COMPOSE up -d
              fi

              # Fail the deploy if it is still broken, rather than reporting
              # success over a box that cannot reach its own database.
              for svc in postgres qdrant; do
                docker run --rm --network celmis_default alpine:3 \
                  getent hosts "$svc" >/dev/null 2>&1 || {
                    echo "::error::$svc does not resolve by service name"; exit 1; }
              done

              # Now that the new images are in use, the previous ones are
              # untagged and safe to drop.
              docker image prune -f
              docker builder prune -f --filter until=24h || true
              df -h / | tail -1

              # The stamp is written BEFORE this step, because containers read
              # .env when they start and a stamp written afterwards would only
              # take effect on the next deploy. The cost of that ordering is
              # that a build which never finishes leaves a .env claiming the
              # new commit is live — which is the exact question the stamp
              # exists to answer, answered wrongly. So prove it: the RUNNING
              # api must report the sha its own .env claims.
              want=$(grep "^CELMIS_GIT_SHA=" .env | tail -1 | cut -d= -f2)
              got=$(docker inspect -f "{{range .Config.Env}}{{println .}}{{end}}" \
                      celmis-api 2>/dev/null | grep "^CELMIS_GIT_SHA=" | cut -d= -f2)
              if [ "$want" != "$got" ]; then
                echo "::error::.env says $want but the running api has ${got:-nothing} — the containers were not recreated"
                exit 1
              fi
              echo "running api confirms $got"

              # And the schema it runs against. `up -d` starting a container
              # whose migration failed leaves new code on an old database,
              # which fails later, elsewhere, as something unrelated.
              docker exec celmis-api alembic current 2>&1 | tail -1 | grep -q "(head)" || {
                echo "::error::the database is not at head — a migration did not run"; exit 1; }
            '

      # The LiteLLM proxy lives behind `profiles: ["gateway"]`, switched on by
      # COMPOSE_PROFILES=gateway in the server .env (Compose reads COMPOSE_*
      # from the project .env, so turning the gateway on never needs a change
      # here). The failure that costs an afternoon is the silent one: a typo in
      # that line and `up -d` cheerfully starts everything EXCEPT the proxy,
      # while the API keeps calling providers directly. So when the operator
      # asked for the gateway, prove it came up.
      - name: Verify the gateway (only when it is switched on)
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" '
              set -e
              cd celmis
              grep -Eq "^COMPOSE_PROFILES=.*gateway" .env || { echo "gateway profile not requested — nothing to verify"; exit 0; }
              for i in $(seq 1 40); do
                state=$(docker inspect -f "{{.State.Health.Status}}" celmis-litellm 2>/dev/null || echo absent)
                [ "$state" = healthy ] && break
                sleep 5
              done
              if [ "$state" != healthy ]; then
                echo "::error::COMPOSE_PROFILES asks for the gateway but celmis-litellm is \"$state\". Bootstrap log:"
                docker logs celmis-litellm-init 2>&1 | tail -20 || true
                docker compose logs --tail=40 litellm || true
                exit 1
              fi
              echo "celmis-litellm: healthy"
              grep -q "^LITELLM_PROXY_URL=http" .env \
                || echo "::warning::the proxy is running but LITELLM_PROXY_URL is unset — the API is still calling providers directly"
            '
