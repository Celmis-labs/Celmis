<text x="22" y="497" fill="#c9d1d9" xml:space="preserve">              {</text>
<text x="22" y="516" fill="#c9d1d9" xml:space="preserve">                &quot;repo_slug&quot;: &quot;…celmis-demo-gateway&quot;,</text>
<text x="22" y="535" fill="#c9d1d9" xml:space="preserve">                &quot;kind&quot;: &quot;variable&quot;,   &quot;file&quot;: &quot;src/contract.ts&quot;,  &quot;line&quot;: 2</text>
<text x="22" y="554" fill="#c9d1d9" xml:space="preserve">              },</text>
