<text x="22" y="725" fill="#6e7681" xml:space="preserve"># One query. Two repositories, two languages, the same contract symbol —</text>
<text x="22" y="744" fill="#6e7681" xml:space="preserve"># from a client that has never checked either of them out.</text>
<text x="22" y="789" fill="#6e7681" font-size="11.5">Recorded 27 Aug 2026 against Celmis 0.1.8+cc7fc7d. Verbatim transcript: logs/05-mcp-session.txt</text>
