<text x="22" y="193" fill="#c9d1d9" xml:space="preserve">          list_projects        get_api_surface      bootstrap_client</text>
<text x="22" y="212" fill="#c9d1d9" xml:space="preserve">          get_project          list_accessible_repos start_integration_walk</text>
<text x="22" y="231" fill="#c9d1d9" xml:space="preserve">          search_symbols       get_my_access        route_incident</text>
