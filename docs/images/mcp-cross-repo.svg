<text x="423.5" y="21.5" fill="#6e7681" text-anchor="middle" font-size="12.0">MCP over HTTP — one query, two repositories</text>
<text x="22" y="60" fill="#6e7681" xml:space="preserve"># An MCP client talking to Celmis over HTTP. Nothing is cloned locally.</text>
<text x="22" y="98" fill="#e3b341" xml:space="preserve">--&gt; initialize</text>
<text x="22" y="117" fill="#e3b341" xml:space="preserve">&lt;-- 200   serverInfo: { &quot;name&quot;: &quot;celmis&quot;, &quot;version&quot;: &quot;1.29.1&quot; }</text>
