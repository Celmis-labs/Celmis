# Observability stack (Stage 21) — Prometheus + Grafana + Loki + Promtail.
#
# Design goal: platform-wide logs, not just Celmis. Promtail tails the
# Docker daemon's container logs (via /var/lib/docker/containers) and
# labels each stream with the container name — so EVERY service running
# on this host (all 30 of them, if you have 30) shows up in Grafana's
# Loki explorer, filterable by container.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# EVERY PORT HERE IS BOUND TO 127.0.0.1, and reached over an ssh tunnel:
#
#   ssh -L 3100:localhost:3100 -L 9090:localhost:9090 you@your-server
#
# They were published without an address, which binds 0.0.0.0. Turning this
# overlay on — the responsible thing to do — opened three ports to the
# internet: Grafana, whose password defaulted to `admin`; Prometheus, which is
# every metric the instance emits; and Loki, which has no authentication of
# its own, so `POST /loki/api/v1/push` accepted writes from anyone who could
# reach it. Log storage strangers can write to is not log storage.
#
# docker-compose.yml already knew: its postgres line carries a note that
# `5432:5432` was verified answering from the open internet. The rule was
# written down in the other file, which is exactly how this one drifted.
#
# Grafana:    http://localhost:3100  (GRAFANA_ADMIN_PASSWORD, required)
# Prometheus: http://localhost:9090
#
# Celmis metrics are scraped from api:8000/metrics (see prometheus.yml).

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: celmis-prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.0
    container_name: celmis-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki-data:/loki
    ports:
      - "127.0.0.1:${LOKI_HOST_PORT:-3105}:3100"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.0
    container_name: celmis-promtail
    volumes:
      - ./observability/promtail.yml:/etc/promtail/config.yml:ro
      # Read ALL container logs on this host — this is what makes the
      # stack platform-wide instead of Celmis-only.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["-config.file=/etc/promtail/config.yml"]
    restart: unless-stopped
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.1.0
    container_name: celmis-grafana
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      # REQUIRED, not defaulted. This was `:-admin`, so the overlay came up
      # with a password anyone can guess. An overlay that refuses to start is
      # a worse afternoon and a better outcome than one that starts open.
      # `./scripts/init-env.sh` generates it.
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set it in .env — ./scripts/init-env.sh generates one}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3100}:3000"
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
